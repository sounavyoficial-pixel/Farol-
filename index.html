<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERA · Bolinha do Farol</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06060a; --surface:#0f0f18; --violet:#7c3aed; --gold:#f59e0b;
    --text:#e8e8f0; --dim:#6b6b8a; --border:rgba(124,58,237,.22);
    --go:#22c55e; --stop:#ef4444; --farol:#f59e0b;
    --orb:56px;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Syne',sans-serif; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--text); position:fixed; inset:0; overflow:hidden; touch-action:none; }

  /* ---------- página por baixo (só pra provar que a bolinha não atrapalha) ---------- */
  .behind{ padding:26px 22px calc(20px + env(safe-area-inset-top)); opacity:.5; transition:opacity .3s, filter .3s; }
  .behind h1{ font-size:1.5rem; font-weight:800; letter-spacing:-.01em; margin-bottom:10px;
    background:linear-gradient(135deg,#a78bfa,#f59e0b); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .behind p{ font-size:.9rem; line-height:1.7; color:var(--dim); max-width:42ch; margin-bottom:16px; }
  .behind .btns{ display:flex; gap:10px; }
  .behind button{ padding:10px 14px; border-radius:9px; font-family:'Space Mono',monospace; font-size:.66rem;
    border:1px solid var(--border); background:#161622; color:var(--text); }
  .behind button.warn{ color:var(--stop); border-color:rgba(239,68,68,.4); }
  body.busy .behind{ opacity:.12; filter:blur(2px); }
  .flash{ animation:fl .5s; } @keyframes fl{ 0%{box-shadow:0 0 0 0 var(--go)} 100%{box-shadow:0 0 0 14px transparent} }
  .shake{ animation:sh .35s; } @keyframes sh{ 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

  /* ---------- a BOLINHA (estado colapsado / mira) ---------- */
  .farol{ position:fixed; z-index:90; width:var(--orb); height:var(--orb); display:grid; place-items:center;
    will-change:left,top,transform; cursor:grab; }
  .farol:active{ cursor:grabbing; }
  .ring{ position:absolute; inset:0; border-radius:50%; border:3px solid var(--c,var(--farol));
    background:radial-gradient(circle,rgba(245,158,11,.16) 0%, rgba(0,0,0,.30) 72%);
    box-shadow:0 0 0 1px rgba(255,255,255,.5),0 6px 22px rgba(0,0,0,.45),0 0 20px -2px var(--c,var(--farol));
    backdrop-filter:blur(1px); transition:border-color .2s,box-shadow .2s,transform .15s; animation:beat 3.4s ease-in-out infinite; }
  .farol:active .ring{ transform:scale(.92); }
  @keyframes beat{ 50%{ box-shadow:0 0 0 1px rgba(255,255,255,.5),0 6px 22px rgba(0,0,0,.45),0 0 30px 1px var(--c,var(--farol)); } }
  /* mira: furo + cruz aparecem só no modo mira */
  .core{ position:relative; width:11px; height:11px; border-radius:50%; box-shadow:0 0 0 1.5px var(--c,var(--farol));
    opacity:0; transition:opacity .2s; pointer-events:none; }
  .farol.mira .core{ opacity:1; }
  .farol.mira .ring{ animation:none; }
  .core::before,.core::after{ content:""; position:absolute; background:var(--c,var(--farol)); }
  .core::before{ left:50%; top:-6px; width:1.5px; height:4px; transform:translateX(-50%); }
  .core::after{ left:50%; bottom:-6px; width:1.5px; height:4px; transform:translateX(-50%); }
  .seal{ position:absolute; top:-10px; left:50%; transform:translateX(-50%); min-width:19px; height:19px; padding:0 5px;
    border-radius:10px; background:var(--c,var(--farol)); color:#06060a; font:700 .7rem/1 'Space Mono',monospace;
    display:grid; place-items:center; opacity:0; transition:.2s; }
  .farol.mira .seal{ opacity:1; }
  .farol.go{ --c:var(--go); } .farol.stop{ --c:var(--stop); }

  .farol.hidden{ opacity:0; transform:scale(.2); pointer-events:none; }

  /* pílula "sair da mira" */
  .exit{ position:fixed; z-index:95; bottom:calc(22px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(10px);
    font:700 .62rem 'Space Mono',monospace; letter-spacing:.08em; padding:9px 16px; border-radius:999px;
    background:rgba(15,17,22,.9); color:var(--farol); border:1px solid var(--border); backdrop-filter:blur(8px);
    opacity:0; pointer-events:none; transition:.25s; }
  .exit.show{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }

  /* ---------- SHEET expandido (OPERA) ---------- */
  .scrim{ position:fixed; inset:0; z-index:88; background:rgba(3,3,7,.55); backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .28s; }
  .scrim.show{ opacity:1; pointer-events:auto; }
  .sheet{ position:fixed; z-index:92; left:10px; right:10px; bottom:0; max-width:560px; margin:0 auto;
    height:min(78vh,620px); background:var(--surface); border:1px solid var(--border);
    border-radius:22px 22px 0 0; box-shadow:0 -10px 50px rgba(0,0,0,.6);
    display:flex; flex-direction:column; transform:translateY(105%); transition:transform .34s cubic-bezier(.22,1,.36,1);
    padding-bottom:env(safe-area-inset-bottom); }
  .sheet.show{ transform:translateY(0); }

  .sheet-top{ display:flex; align-items:center; gap:12px; padding:16px 18px 10px; }
  .mini-orb{ width:34px; height:34px; border-radius:50%; flex:none; cursor:pointer;
    background:radial-gradient(circle at 34% 30%,#fff6e0,var(--farol) 45%,#C77800);
    box-shadow:0 0 0 1px rgba(255,255,255,.5),0 0 14px -2px var(--farol); }
  .sheet-top .who{ flex:1; }
  .sheet-top .who b{ font-size:.95rem; font-weight:800; }
  .sheet-top .who small{ display:block; font:.55rem 'Space Mono',monospace; color:var(--dim); letter-spacing:.1em; text-transform:uppercase; }
  .close{ font-size:1.1rem; color:var(--dim); background:none; border:none; padding:6px; }

  .chips{ display:flex; gap:8px; padding:4px 16px 12px; overflow-x:auto; }
  .chip{ flex:none; padding:10px 14px; border-radius:12px; border:1px solid var(--border); background:#161622;
    color:var(--text); font-size:.8rem; display:flex; align-items:center; gap:7px; }
  .chip:active{ transform:scale(.96); }

  .log{ flex:1; overflow-y:auto; padding:8px 16px 12px; display:flex; flex-direction:column; gap:10px; }
  .msg{ max-width:82%; padding:11px 14px; border-radius:16px; font-size:.9rem; line-height:1.55; }
  .msg.me{ align-self:flex-end; background:var(--violet); color:#fff; border-bottom-right-radius:5px; }
  .msg.g{ align-self:flex-start; background:#181826; border:1px solid var(--border); border-bottom-left-radius:5px; }
  .msg.g.think{ color:var(--dim); font-style:italic; }
  .empty{ margin:auto; text-align:center; color:var(--dim); font-size:.8rem; line-height:1.7; padding:20px; }

  .input{ display:flex; gap:8px; align-items:flex-end; padding:10px 12px 12px; border-top:1px solid var(--border); }
  .mic{ width:46px; height:46px; flex:none; border-radius:50%; border:1px solid var(--border); background:#161622; color:var(--gold); font-size:1.2rem; }
  .mic.rec{ background:rgba(239,68,68,.15); border-color:var(--stop); color:var(--stop); animation:pl 1.2s infinite; }
  @keyframes pl{ 50%{ box-shadow:0 0 0 8px rgba(239,68,68,0); } 0%,100%{ box-shadow:0 0 0 0 rgba(239,68,68,.35);} }
  .field{ flex:1; min-height:46px; max-height:110px; resize:none; border-radius:14px; border:1px solid var(--border);
    background:#0c0c14; color:var(--text); padding:13px 14px; font-size:.9rem; outline:none; }
  .send{ width:46px; height:46px; flex:none; border-radius:50%; border:none; background:var(--violet); color:#fff; font-size:1.1rem; }
  .send:disabled{ opacity:.4; }

  @media (prefers-reduced-motion:reduce){ .ring{ animation:none; } }
</style>
</head>
<body>
  <!-- página por baixo (demonstra que a bolinha não atrapalha; alvos p/ a mira) -->
  <div class="behind">
    <h1>Você navegando…</h1>
    <p>A bolinha fica quietinha no canto. Nada aparece até você tocar nela. Toque → expande a OPERA. Toque de novo → recolhe.</p>
    <div class="btns">
      <button data-guide="go">📤 Enviar</button>
      <button class="warn" data-guide="stop">🗑 Apagar tudo</button>
    </div>
  </div>

  <!-- a bolinha -->
  <div class="farol" id="orb">
    <div class="ring"></div>
    <div class="seal" id="seal">○</div>
    <div class="core"></div>
  </div>
  <div class="exit" id="exit">sair da mira ✕</div>

  <!-- overlay expandido -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-top">
      <div class="mini-orb" id="miniOrb" title="recolher"></div>
      <div class="who"><b>GaIA · Farol</b><small>OPERA · voz · inclusão</small></div>
      <button class="close" id="closeBtn">✕</button>
    </div>
    <div class="chips">
      <button class="chip" id="chipMira">👁 Mira</button>
      <button class="chip" data-say="Guardar isto na minha Box">📦 Guardar</button>
      <button class="chip" data-say="Ler pra mim o que está na tela">🔊 Ler</button>
      <button class="chip" data-say="Copiar para o Violet Box">📋 Copiar</button>
    </div>
    <div class="log" id="log">
      <div class="empty" id="empty">Fale ou escreva.<br>A GaIA responde aqui — de costas para o centro.</div>
    </div>
    <div class="input">
      <button class="mic" id="mic" title="falar">🎤</button>
      <textarea class="field" id="field" rows="1" placeholder="Escreva ou toque no microfone…"></textarea>
      <button class="send" id="send" disabled>➤</button>
    </div>
  </div>

<script>
(function(){
  const orb=document.getElementById('orb'), seal=document.getElementById('seal');
  const scrim=document.getElementById('scrim'), sheet=document.getElementById('sheet');
  const exitPill=document.getElementById('exit');
  const SZ=56, H=SZ/2, M=12;
  let x=window.innerWidth-SZ-M, y=window.innerHeight*0.55; place();
  function place(){ orb.style.left=x+'px'; orb.style.top=y+'px'; }
  function cx(){return x+H;} function cy(){return y+H;}

  let mode='idle';            // idle | mira | open
  let drag=false,moved=false,sx,sy,ox,oy;
  function pt(e){ return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY}; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  function down(e){ if(mode==='open')return; const p=pt(e); drag=true;moved=false;sx=p.x;sy=p.y;ox=x;oy=y; }
  function move(e){ if(!drag)return; const p=pt(e); const dx=p.x-sx,dy=p.y-sy;
    if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
    x=clamp(ox+dx,M,window.innerWidth-SZ-M); y=clamp(oy+dy,M+40,window.innerHeight-SZ-M);
    place(); if(mode==='mira') evaluate(); e.preventDefault(); }
  function upOrb(){ if(!drag)return; drag=false;
    if(moved){ if(mode!=='mira') snap(); }
    else { mode==='mira'? miraTap() : expand(); } }
  function snap(){ const mid=window.innerWidth/2; x=(cx()<mid)?M:window.innerWidth-SZ-M;
    orb.style.transition='left .28s cubic-bezier(.22,1,.36,1)'; place(); setTimeout(()=>orb.style.transition='',300); }

  orb.addEventListener('mousedown',down); orb.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mousemove',move); window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',upOrb); window.addEventListener('touchend',upOrb);

  /* ---------- expandir / recolher ---------- */
  function expand(){ mode='open'; document.body.classList.add('busy');
    orb.classList.add('hidden'); scrim.classList.add('show'); sheet.classList.add('show'); }
  function collapse(){ mode='idle'; document.body.classList.remove('busy');
    sheet.classList.remove('show'); scrim.classList.remove('show'); orb.classList.remove('hidden'); }
  document.getElementById('closeBtn').addEventListener('click',collapse);
  document.getElementById('miniOrb').addEventListener('click',collapse);
  scrim.addEventListener('click',collapse);

  /* ---------- MIRA (precisão go/stop) ---------- */
  document.getElementById('chipMira').addEventListener('click',()=>{ collapse(); enterMira(); });
  function enterMira(){ mode='mira'; orb.classList.add('mira'); exitPill.classList.add('show'); evaluate(); }
  function exitMira(){ mode='idle'; orb.classList.remove('mira','go','stop'); seal.textContent='○'; exitPill.classList.remove('show'); }
  exitPill.addEventListener('click',exitMira);

  let current=null;
  function underAim(){ orb.style.visibility='hidden'; const el=document.elementFromPoint(cx(),cy()); orb.style.visibility=''; return el?el.closest('[data-guide]'):null; }
  function evaluate(){ const t=underAim(); orb.classList.remove('go','stop');
    if(!t){ seal.textContent='○'; current=null; return; }
    if(t.dataset.guide==='go'){ orb.classList.add('go'); seal.textContent='✓'; }
    else{ orb.classList.add('stop'); seal.textContent='✕'; } current=t; }
  function miraTap(){ if(!current)return;
    if(current.dataset.guide==='go'){ current.classList.add('flash'); setTimeout(()=>current&&current.classList.remove('flash'),500); navigator.vibrate&&navigator.vibrate(15); }
    else{ current.classList.add('shake'); setTimeout(()=>current&&current.classList.remove('shake'),350); navigator.vibrate&&navigator.vibrate([30,40,30]); } }

  window.addEventListener('resize',()=>{ x=clamp(x,M,window.innerWidth-SZ-M); y=clamp(y,M+40,window.innerHeight-SZ-M); place(); });

  /* ---------- CHAT (motor Claude — modo GaIA Comercial) ---------- */
  const log=document.getElementById('log'), empty=document.getElementById('empty');
  const field=document.getElementById('field'), send=document.getElementById('send'), mic=document.getElementById('mic');
  let history=[];
  field.addEventListener('input',()=>{ send.disabled=!field.value.trim();
    field.style.height='auto'; field.style.height=Math.min(field.scrollHeight,110)+'px'; });
  send.addEventListener('click',ask);
  field.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); ask(); } });
  document.querySelectorAll('[data-say]').forEach(c=>c.addEventListener('click',()=>{ field.value=c.dataset.say; send.disabled=false; ask(); }));

  function bubble(text,cls){ if(empty)empty.remove();
    const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; log.appendChild(d); log.scrollTop=log.scrollHeight; return d; }

  async function ask(){
    const q=field.value.trim(); if(!q)return;
    bubble(q,'me'); field.value=''; field.style.height='auto'; send.disabled=true;
    history.push({role:'user',content:q});
    const think=bubble('…','g think');
    try{
      const r=await fetch('https://api.anthropic.com/v1/messages',{ method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1000,
          system:'Você é a GaIA, assistente de inclusão do Sounavy dentro da OPERA. Responda em português do Brasil, curto, claro e acolhedor, para alguém que usa por voz. Uma ideia por vez.',
          messages:history }) });
      const data=await r.json();
      const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim()||'(sem resposta)';
      think.remove(); const g=bubble(txt,'g'); history.push({role:'assistant',content:txt});
      speak(txt);
    }catch(err){ think.remove(); bubble('Não consegui responder agora. (O chat só funciona dentro do app Claude.)','g'); }
  }

  /* voz: falar (TTS) e ouvir (STT) */
  function speak(t){ try{ const u=new SpeechSynthesisUtterance(t); u.lang='pt-BR'; speechSynthesis.speak(u); }catch(e){} }
  let rec=null, listening=false;
  mic.addEventListener('click',()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ bubble('Reconhecimento de voz precisa do Safari.','g'); return; }
    if(listening){ rec.stop(); return; }
    rec=new SR(); rec.lang='pt-BR'; rec.interimResults=true;
    rec.onresult=e=>{ let s=''; for(const r of e.results) s+=r[0].transcript; field.value=s; send.disabled=!s.trim();
      field.style.height='auto'; field.style.height=Math.min(field.scrollHeight,110)+'px'; };
    rec.onend=()=>{ listening=false; mic.classList.remove('rec'); };
    rec.start(); listening=true; mic.classList.add('rec');
  });
})();
</script>
</body>
</html>
